<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HackSphere — Where Ideas Become Innovation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFF"/>
      <stop offset="1" stop-color="#ECEFFF"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5A41E6"/>
      <stop offset="0.55" stop-color="#4285FF"/>
      <stop offset="1" stop-color="#3DCFAE"/>
    </linearGradient>
    <radialGradient id="sphere" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#B9ABFF"/>
      <stop offset="0.55" stop-color="#7058F5"/>
      <stop offset="1" stop-color="#4A32D1"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#5A41E6" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>

  <!-- drifting colour orbs -->
  <g filter="url(#blur)" opacity="0.55">
    <circle cx="180" cy="80" r="90" fill="#7058F5">
      <animate attributeName="cx" values="180;260;180" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;130;80" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="300" r="80" fill="#3DCFAE">
      <animate attributeName="cx" values="560;640;560" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="70" r="85" fill="#4285FF">
      <animate attributeName="cy" values="70;140;70" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1090" cy="290" r="70" fill="#FF7890">
      <animate attributeName="cx" values="1090;1000;1090" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="230" r="55" fill="#FFC857">
      <animate attributeName="cy" values="230;180;230" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- glass panel -->
  <rect x="24" y="24" width="1152" height="292" rx="24" fill="#FFFFFF" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.9"/>

  <!-- clay sphere + orbit -->
  <g transform="translate(170 170)">
    <ellipse rx="112" ry="38" fill="none" stroke="#7058F5" stroke-opacity="0.35" stroke-width="3" transform="rotate(-24)">
      <animateTransform attributeName="transform" type="rotate" values="-24;336" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <circle r="66" fill="url(#sphere)" filter="url(#soft)">
      <animate attributeName="r" values="66;69;66" dur="4s" repeatCount="indefinite"/>
    </circle>
    <ellipse cx="-22" cy="-26" rx="20" ry="11" fill="#FFFFFF" fill-opacity="0.55" transform="rotate(-30 -22 -26)"/>
    <g>
      <circle cx="112" cy="0" r="9" fill="#FFC857"/>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="7s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="-86" cy="0" r="7" fill="#3DCFAE"/>
      <animateTransform attributeName="transform" type="rotate" values="180;540" dur="9s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="0" cy="-96" r="6" fill="#FF7890"/>
      <animateTransform attributeName="transform" type="rotate" values="90;450" dur="11s" repeatCount="indefinite"/>
    </g>
    <text x="0" y="14" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">&lt;/&gt;</text>
  </g>

  <!-- title -->
  <text x="320" y="158" font-family="'Segoe UI', 'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="86" font-weight="800" fill="url(#title)" letter-spacing="-2">
    HackSphere
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="324" y="206" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#202747">
    Where Ideas Become Innovation
    <animate attributeName="opacity" values="0;1" begin="0.5s" dur="1.2s" fill="freeze"/>
  </text>

  <!-- role chips -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700">
    <g>
      <rect x="324" y="238" width="132" height="36" rx="18" fill="#3DCFAE" fill-opacity="0.22"/>
      <text x="390" y="262" text-anchor="middle" fill="#0F7A63">Participants</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3.2s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="470" y="238" width="124" height="36" rx="18" fill="#7058F5" fill-opacity="0.18"/>
      <text x="532" y="262" text-anchor="middle" fill="#4A32D1">Organizers</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3.2s" begin="0.4s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="608" y="238" width="90" height="36" rx="18" fill="#FF7890" fill-opacity="0.22"/>
      <text x="653" y="262" text-anchor="middle" fill="#B93A55">Judges</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="712" y="238" width="96" height="36" rx="18" fill="#4285FF" fill-opacity="0.18"/>
      <text x="760" y="262" text-anchor="middle" fill="#1F5FD6">Admins</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3.2s" begin="1.2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- floating sparks -->
  <g fill="#FFC857">
    <circle cx="1010" cy="110" r="6"><animate attributeName="cy" values="110;90;110" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="190" r="4" fill="#7058F5"><animate attributeName="cy" values="190;212;190" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="250" r="5" fill="#3DCFAE"><animate attributeName="cy" values="250;232;250" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="270" r="7" fill="#FF7890"><animate attributeName="cy" values="270;250;270" dur="4.4s" repeatCount="indefinite"/></circle>
  </g>
</svg>
